name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match Info.plist version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match CFBundleShortVersionString $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Checks
        run: make check

      - name: Build DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: make dmg

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]"
            exit 1
          fi

      # Installed copies find updates at releases/latest/download/appcast.xml (SUFeedURL).
      # Without the key the DMG would be unsigned and Sparkle would refuse it, so stop here.
      - name: Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret isn't set"
            exit 1
          fi
          scripts/appcast.sh build/release-notes.md

      # A fixed name too, so releases/latest/download/Peeko.dmg always gets the newest one.
      - name: Unversioned DMG copy
        run: cp "build/Peeko-$VERSION.dmg" build/Peeko.dmg

      - uses: softprops/action-gh-release@v3
        with:
          name: Peeko ${{ env.VERSION }}
          body_path: build/release-notes.md
          files: |
            build/Peeko-${{ env.VERSION }}.dmg
            build/Peeko-${{ env.VERSION }}.dmg.sha256
            build/Peeko.dmg
            build/appcast.xml
